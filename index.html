 L('number-sense','Arithmetic & number sense','math','bars','Percentages, fractions, mental calculations and rapid estimates.',
 'A fraction is a count relative to a whole. In trading interviews, convert it to a percentage and back without losing track of the base. Compound changes multiply rather than cancel.',
 'new = old × (1 + r₁) × (1 + r₂)', 'Percent, fraction, increase, decrease, magnitude', 'Up 20%, then down 20% is a net loss of 4%, not zero.', 'Price changes, win rates, conversion rates and risk limits.', '100 → 120 → 96: the return is −4%.'),

  <script>/* AXIOM Studio, independent extended teaching notes and multi-step problem engine.

'use strict';
const PEDAGOGY = (() => {
const S = {
'number-sense': ['Relative changes must be multiplied, not added. If a price changes from P to P(1+r), the inverse change needed to return to P is −r/(1+r), not −r.','For an increase of 25%, recovering the original price requires a decline of 20%. The inverse percentage is asymmetric because the base changes.','A spread of 5 basis points on $80 is $0.04, not $0.40. One basis point is 0.01 percentage points.','Quant connection: small rounding errors compound when converted between per-share, per-contract, and portfolio-level risk.'],
'algebra':['Solving a state equation means isolating the unknown from its own future contribution. If E=1+pE, then E=1/(1−p), provided p<1.','Consider a two-state waiting problem: A=1+½A+½B and B=1+½A. Substitute the second equation into the first; the system reduces to one variable.','Edge case: when continuation probability tends to one, the expected duration diverges; this warns you to check whether an algebraic solution is finite.','Quant connection: Markov decision models often hide a linear system inside a narrative about coins or market events.'],
'counting':['Counting is a modeling problem before it is a formula problem. Decide whether order matters, whether repeats are allowed, and which outcomes are equally likely.','The complement technique avoids counting messy unions: at least one success equals one minus the probability of no successes.','Unique example: in a 52-card deck the probability of at least one ace in five cards is 1−C(48,5)/C(52,5), not 5×4/52.','When outcomes are not exchangeable, a symmetric counting argument can be wrong even if its arithmetic is impeccable.'],
'calculus':['The derivative is the coefficient of first-order change: f(x+h)=f(x)+f′(x)h+o(h). This makes differentiation a local sensitivity tool.','At a smooth interior maximum, f′(x)=0, but that alone proves nothing; inspect second derivative and feasible boundaries.','Unique example: maximizing a quote-distance revenue proxy R(d)=dAe^(−kd) gives R′(d)=Ae^(−kd)(1−kd), hence optimal d=1/k.','In real order execution the fill intensity is estimated, and tick size, fees, adverse selection and inventory all shift the optimum.'],
'expected-value':['Expectation is a linear functional: E[aX+bY]=aE[X]+bE[Y]. This does not require independence, even when X and Y are strongly dependent.','For a fair die, E[X]=3.5 although the die never displays 3.5; expected value describes the distribution, not a possible outcome.','Unique example: for n randomly permuted hats, each person has probability 1/n of recovering their own hat. The expected number of correct hats is exactly one for every n, despite dependence.','A decision requires evaluating the payoff of each admissible strategy; averaging over the options is not a valid optimization method.'],
'indicators':['An indicator I_A takes value one on event A and zero otherwise. Its expectation is precisely P(A), a bridge from counting to probability.','For n independent fair dice, define I_ij as the event that dice i and j match. E[Σ_i<j I_ij]=C(n,2)/6 even though pair indicators are not mutually independent.','Unique example: among 30 dice, expected matching pairs is C(30,2)/6=72.5; non-integer expectations for integer counts are perfectly valid.','This trick generalizes to expected collisions in hash tables, matching birthdays, and count-based loss functions.'],
'conditional':['Conditional probability is a new probability measure on the worlds consistent with evidence B. Formally P(A|B)=P(A∩B)/P(B).','Always ask what information was observed and how it was selected. An event observed through a biased sampling mechanism may not give the same posterior as the same event sampled uniformly.','Unique example: knowing a random two-child family has at least one boy is different from encountering a boy selected at random and asking about the sibling. The sample spaces differ.','Treat exchange and trade observations similarly: marketable orders are not a random cross-section of all traders.'],
'bayes':['Bayes is a change of viewpoint: from P(evidence|state) to P(state|evidence). The denominator must count all paths to that evidence.','For a population of 10,000 with a 1% event rate, 90% sensitivity, and 5% false-positive rate, expect 90 true positive cases and 495 false positives; the posterior is 90/585≈15.38%.','Unique example: a classifier can be 95% specific yet most alerts can be false when the underlying event is rare. Alter the prior to see this in the 3D evidence model.','Adversarial caveat: repeated observations are not independent by default. Blindly multiplying correlated likelihoods leads to overconfidence.'],
'recursive':['State design is the hard part. A state must summarize exactly the information needed to predict future transitions; more history is redundant if the Markov property holds.','For waiting for HH: E0=1+½E1+½E0 and E1=1+½·0+½E0. Solving gives E0=6 and E1=4.','Unique example: HTH and HHH have identical one-shot probability 1/8 but different average waiting times, because overlapping prefixes affect resets.','A solution must also pass boundary tests: success states have expected remaining time zero, not one.'],
'stopping':['A stopping decision compares the certain value of stopping now with expected continuation value, including costs, future options and restrictions.','With one free reroll of a six-sided die, continuation has expected payoff 3.5. Keep values 4–6, reroll 1–3, and the game is worth (3×3.5+4+5+6)/6=4.25.','Unique example: if the final reroll costs one dollar, continuation falls to 2.5; now keeping a 3 is optimal. The threshold moves even though the dice have not changed.','For multiple opportunities, solve backward from the last decision; a one-step heuristic is not guaranteed to be optimal.'],
'variance':['Variance obeys Var(X)=E[X²]−E[X]² and Var(aX+b)=a²Var(X). It measures spread around expectation in squared units.','For two assets, Var(w₁X+w₂Y)=w₁²σ₁²+w₂²σ₂²+2w₁w₂Cov(X,Y). That covariance term explains diversification.','Unique example: two equally volatile assets with correlation −1 can cancel risk for a properly balanced portfolio; the same assets with correlation +1 cannot.','Zero correlation does not imply independence except under specific distributional assumptions.'],
'correlation':['Correlation is standardized covariance and lies in [−1,1]. It quantifies linear co-movement, not causation or general statistical dependence.','If σX=2, σY=3 and ρ=−0.5, then Cov(X,Y)=−3. For 50% allocations, portfolio variance is ¼(4+9+2×(−3))=1.75.','Unique example: let X be symmetric about zero and Y=X². Cov(X,Y)=0 can hold even though Y is determined by X.','The geometry of a joint density rotates as ρ changes, but a change in correlation does not necessarily change marginal means or variances.'],
'inference':['Standard deviation describes data dispersion. Standard error describes uncertainty of an estimator; the distinction is fundamental.','For independent observations with finite variance, SE(mean)=σ/√n. To halve SE requires four times as many observations.','Unique example: searching 1,000 independent noise strategies with a 1% testing threshold produces about ten false positives on average even if no strategy has genuine alpha.','Careful research separates discovery from validation. A statistically significant backtest may not survive fees, market impact, or a genuinely untouched test set.'],
'regression':['OLS finds the coefficients that minimize squared residuals. With one predictor, β̂=Σ(xᵢ−x̄)(yᵢ−ȳ)/Σ(xᵢ−x̄)² and α̂=ȳ−β̂x̄.','For x=[1,2,3], y=[2,4,5], compute x̄=2, ȳ=11/3 and β̂=3/2. Then α̂=2/3. Residuals are the observed minus fitted values.','Unique example: a model with R²=0.99 on training data can still perform disastrously on a regime shift; R² is not a warranty of forecasting ability.','When the design matrix is ill-conditioned, solving normal equations with an explicit inverse magnifies numerical errors; QR or SVD is safer.'],
'validation':['A discovered pattern has to survive data it did not influence. Holdout leakage and repeated parameter selection corrupt nominal p-values.','A realistic workflow partitions data chronologically, accounts for transaction costs, limits the search over strategies, and stress-tests performance by regime.','Unique example: a strategy with a profitable gross Sharpe can have negative net P&L when turnover and adverse selection are included.','Avoid treating correlated daily returns as independent; the effective sample size may be much smaller.'],
'orderbook':['A limit order book stores resting buy and sell interest. The best bid is the highest resting buy; the best ask is the lowest resting sell.','A market buy walks asks in price priority until its quantity is filled. The average execution price rises as available top-of-book depth is depleted.','Unique example: a 250-share buy market order against asks of 100 @ $100.01 and 200 @ $100.02 executes 100 at $100.01 and 150 at $100.02; VWAP is $100.016.','Real markets use price/time priority or venue-specific variants. Queue position, hidden liquidity, cancels and exchange fees matter.'],
'quoting':['A dealer chooses bid and ask to balance fill probability, spread capture and inventory exposure. Increasing quote distance usually lowers fill intensity.','Do not confuse information-driven changes in fair value with an inventory-driven shift in your preferred quote center. A long position tends to make a risk-averse dealer prefer selling.','Unique example: if a news event moves the estimated fair value by $0.20, both quotes may move up. If instead inventory turns very long, quotes may shift downward without the fundamental estimate changing.','A simulated positive spread is not guaranteed profit: adverse selection and execution costs can dominate it.'],
'avellaneda-stoikov':['Avellaneda–Stoikov models a dealer with stochastic mid-price, exponential-utility inventory risk, and arrival intensities depending on quote distance. It is a model, not a turnkey strategy.','An approximate finite-horizon reservation price is r=S−qγσ²τ with τ=T−t. Differentiating gives ∂r/∂q=−γσ²τ; greater long inventory lowers the preferred valuation.','A common approximate total spread is γσ²τ+(2/γ)ln(1+γ/k), assuming the paper’s simplified exponential fill model. Bid=r−spread/2; ask=r+spread/2.','Unique example: at S=100, q=4, γ=0.1, σ=2, τ=0.5, the reservation price is 99.2. The $0.80 difference comes from inventory risk, not a prediction of a price decline.','Limitations: discrete ticks, state-dependent order arrivals, queue rank, asymmetric information, jumps, fees and calibrated parameters can make practical results diverge.'],
'markov':['A Markov chain models transitions where the next-state distribution depends on the current state, not on the entire recorded history.','For transient states, expected time to absorption satisfies E=1+PE, hence (I−P)E=1. Choosing states correctly is more important than matrix manipulation.','Unique example: the fair-coin pattern HHH has expected wait 14, whereas HTH has expected wait 10: equal-length patterns need not have equal waiting times.','Markov order-book models can describe queue arrivals and cancellations, but transition rates may vary with regime and time.']
};

'expected-value':()=>{let p=[20,25,40,50,60][Math.floor(Math.random()*5)],win=[10,20,40][Math.floor(Math.random()*3)],fee=[1,2,3][Math.floor(Math.random()*3)];return m(`A binary payoff pays $${win} with probability ${p}%, otherwise $0. Entry costs $${fee}. Compute the expectation before and after the cost, then decide whether net EV is positive.`,[{label:'Gross expected payoff ($)',answer:p*win/100},{label:'Net expected payoff ($)',answer:p*win/100-fee},{label:'Net-positive? (1=yes, 0=no)',answer:Number(p*win/100>fee)}],`Gross = p×payoff; net = gross−fee; only enter if positive EV under the stated objective.`,'Decision EV');},

'inference':()=>{let s=[4,6,8][Math.floor(Math.random()*3)],n=[25,100,400][Math.floor(Math.random()*3)],mu=[1,2,3][Math.floor(Math.random()*3)];let se=s/Math.sqrt(n);return m(`A sample of n=${n} observations has mean ${mu} and sample SD ${s}. Use the rough ±2SE method.`,[{label:'Standard error',answer:se},{label:'Lower 95% endpoint',answer:mu-2*se},{label:'Upper 95% endpoint',answer:mu+2*se}],`SE=s/√n. The approximate interval is mean±2SE; it is not a 95% probability that the fixed parameter lies in this realized interval.`,'Estimate and uncertainty');},
'correlation':()=>{let rho=[-.5,0,.5][Math.floor(Math.random()*3)],sx=[2,4][Math.floor(Math.random()*2)],sy=[3,6][Math.floor(Math.random()*2)];let cov=rho*sx*sy;return m(`Two returns have SDs ${sx} and ${sy}; correlation is ${rho}. Construct the covariance and the variance of an equally weighted two-asset portfolio.`,[{label:'Cov(X,Y)',answer:cov},{label:'Var(0.5X+0.5Y)',answer:.25*sx*sx+.25*sy*sy+.5*cov},{label:'SD of 50/50 portfolio',answer:Math.sqrt(.25*sx*sx+.25*sy*sy+.5*cov)}],`Use Cov=ρσ₁σ₂, then Var(.5X+.5Y)=.25Var(X)+.25Var(Y)+.5Cov.`,'Portfolio risk decomposition');},
'regression':()=>{let intercept=[1,2,3][Math.floor(Math.random()*3)],slope=[1,2,3][Math.floor(Math.random()*3)],x=[1,2,3];let y=x.map(v=>intercept+slope*v);return m(`Three observations are (x,y) = (1,${y[0]}), (2,${y[1]}), (3,${y[2]}). Fit y=α+βx exactly and predict at x=5.`,[{label:'Slope β',answer:slope},{label:'Intercept α',answer:intercept},{label:'Prediction at x=5',answer:intercept+5*slope}],`Here the observations lie exactly on a line. β=(y₃−y₁)/(3−1), α=y₁−β, prediction=α+5β.`,'OLS mechanics');},
'quoting':()=>{let fair=100+Math.floor(Math.random()*8),half=[.1,.2,.3][Math.floor(Math.random()*3)],inventory=[-4,0,4][Math.floor(Math.random()*3)],skew=inventory*.05;return m(`A dealer's fundamental fair value is $${fair}. Half-spread is $${half.toFixed(2)}. Inventory q=${inventory} creates a quote-center shift of −$0.05 per long unit.`,[{label:'Risk-adjusted quote center',answer:fair-skew},{label:'Bid quote',answer:fair-skew-half},{label:'Ask quote',answer:fair-skew+half}],`Inventory is a preference adjustment: center=S−0.05q, then bid=center−half-spread and ask=center+half-spread. This is illustrative, not a calibrated model.`,'Inventory-aware quotes');},
'orderbook':()=>{let first=100+Math.floor(Math.random()*10),second=first+1,qty=100+Math.floor(Math.random()*3)*50,order=qty+50;return m(`An ask book has ${qty} shares at $${first}.00 and sufficient additional shares at $${second}.00. An incoming market BUY for ${order} shares sweeps both levels.`,[{label:'Shares executed at the second level',answer:order-qty},{label:'Total dollar cost',answer:qty*first+(order-qty)*second},{label:'Volume weighted execution price ($)',answer:(qty*first+(order-qty)*second)/order}],`Price priority consumes level 1 first, then level 2. VWAP=total cash spent/total shares.`,'Order book execution');},
'avellaneda-stoikov':()=>{let q=[-4,-2,0,2,4][Math.floor(Math.random()*5)],gamma=.1,sigma=2,t=.5,s=100,k=2;let r=s-q*gamma*sigma*sigma*t;let sp=gamma*sigma*sigma*t+2/gamma*Math.log(1+gamma/k);return m(`Approximate Avellaneda–Stoikov model: S=$100, q=${q}, γ=0.1, σ=2, remaining time τ=0.5, intensity decay k=2. Calculate the reservation price, total approximate spread and quote levels.`,[{label:'Reservation price r ($)',answer:r},{label:'Approximate total spread ($)',answer:sp},{label:'Bid ($)',answer:r-sp/2},{label:'Ask ($)',answer:r+sp/2}],`r=S−qγσ²τ; spread=γσ²τ+(2/γ)ln(1+γ/k). Quotes are centered on r. Assumes the paper's simplified exponential intensity model.`,'Derive market-making quotes');}
};
function next(topic){return B[topic]?.()||null;}
function available(topic){return !!B[topic];}
return {chapter,next,available};
})();

<div class="visual-chapter"><div class="content-width">${headerTag('01 / INTERACTIVE FIGURE')}${visualFigure(l)}</div></div>
<div class="content-width lesson-reading"><div class="lesson-main"><section class="reader-section" id="idea">${headerTag('02 / THE IDEA')}<h2>Understand the <em>intuition.</em></h2><p class="body-lead">${e(l.idea)}</p><div class="example-line"><span>WORKED EXAMPLE</span><p>${e(l.example)}</p></div></section>
<section class="reader-section" id="math">${headerTag('03 / THE MATHEMATICS')}<h2>Where the <em>maths comes from.</em></h2><div class="formula-display">${e(l.formula)}</div><ol class="derivation">${steps.map(t=>`<li>${e(t)}</li>`).join('')}</ol>${EXTRA_INSIGHT[l.id]||''}</section>${PEDAGOGY.chapter(l)}
<section class="reader-section" id="desk">${headerTag('04 / ON THE DESK')}<h2>Why this <em>matters.</em></h2><p>${e(l.desk)}</p><div class="trap-note"><strong>THE CLASSIC TRAP</strong><p>${e(l.trap)}</p></div></section>
<section class="reader-section practice-block" id="mastery">${headerTag('05 / CHECK YOURSELF')}<h2>Understanding must <em>survive a new problem.</em></h2><p>Try a warm-up without consequences, or attempt the mastery check. Five correct first attempts are required, including multi-step numerical work where available. Written explanations are reviewed with a rubric, not automatically marked. A mistake triggers a different repair problem and a fresh check.</p><div id="exerciseArea"></div></section>
</div><aside class="reading-side"><div class="reading-sticky"><div class="side-eyebrow">IN THIS LESSON</div><a href="#idea">01 The idea</a><a href="#math">02 The mathematics</a><a href="#desk">03 On the desk</a><a href="#depth">04 Deep dive</a><a href="#mastery">05 Mastery check</a><hr><div class="side-eyebrow">RECOGNITION CUE</div><p>${e(l.recognize)}</p><a href="#/${at.course}" class="back-course">Full course map ↗</a></div></aside></div></div>`;
}
function examsPage(){return `<div class="content-width practice-page"><div class="subnav"><a href="#/">← The studio</a><span>PERFORMANCE LAB</span></div>${headerTag('ADAPTIVE PRACTICE')}<h1>Prove what<br><em>you understand.</em></h1><p class="page-lead">Every topic includes randomized exercises and a strict 100% mastery gate. Every module finishes with a cumulative 10-question exam. Wrong answers generate targeted repair before a newly generated attempt.</p><div class="practice-grid">${['math','quant'].map(course=>`<div class="practice-column"><div class="practice-column-head"><span>${course==='math'?'01 / MATH':'02 / QUANT'}</span><h2>${course==='math'?'Mathematics':'Quant learning'}</h2><p>${masteryCount(course)}/${courseTotal(course)} mastered · ${examCount(course)}/${MODULES[course].length} examinations passed</p></div>${MODULES[course].map(m=>`<div class="practice-item"><div><strong>${e(m.title)}</strong><span>${m.ids.filter(mastered).length}/${m.ids.length} mastered</span></div>${examUnlocked(course,m.id)?`<a href="#/exam/${course}/${m.id}">${moduleExam(course,m.id)?'Retake':'Start'} ↗</a>`:'<span class="locked-small">LOCKED</span>'}</div>`).join('')}<div class="practice-button">${buttonToNext(course)}</div></div>`).join('')}</div><div class="ledger"><h2>Your error ledger.</h2><p>Errors stay visible so the next study session can target patterns rather than memorized answers.</p><div>${Object.entries(progress.misses).sort((a,b)=>b[1]-a[1]).slice(0,7).map(([id,n])=>`<a href="${linkLesson(id)}"><span>${e(LESSON_MAP[id]?.title||id)}</span><strong>${n} miss${n===1?'':'es'}</strong> ↗</a>`).join('')||'<p>No recorded mistakes. Complete a practice set to build your personal review list.</p>'}</div></div><div class="backup-box"><div><strong>Progress lives in this browser until you export it.</strong><p>Download a backup before switching devices or clearing browser data.</p></div><button class="btn btn-line" id="exportProgress">Export progress ↓</button><label class="btn btn-line backup-file">Restore progress <input type="file" id="importProgress" accept="application/json" hidden></label><button class="btn btn-line" id="toggleManual">${progress.manual?.all?'Re-enable strict locks':'Unlock all for exploration'}</button></div><p class="manual-explain">The unlock toggle opens lessons and exams for review without altering earned scores or completion badges. Upload a JSON backup to restore progress on a different device.</p></div>`;}
function engineeringPage(){return `<div class="content-width eng-page"><div class="subnav"><a href="#/">← The studio</a><span>FUTURE CURRICULUM</span></div>${headerTag('BUILT INTO THE ARCHITECTURE · NOT RELEASED')}<h1>Engineering,<br><em>without the shortcuts.</em></h1><p class="page-lead">Three future independent academies will use the same visual experiments, adaptive corrections and mastery gates. Nothing is represented as finished yet.</p><div class="engineering-list"><div><span>01</span><div><h2>Software engineering.</h2><p>Language fundamentals, C++ memory and concurrency, testing, performance profiling, low-latency systems and coding fluency.</p></div><span class="coming">PLANNED</span></div><div><span>02</span><div><h2>Data structures & algorithms.</h2><p>Arrays, graphs, trees, dynamic programming, complexity analysis, invariants and competitive problem solving.</p></div><span class="coming">PLANNED</span></div><div><span>03</span><div><h2>System design.</h2><p>Networking, databases, messaging, caching, reliability, distributed systems and trading infrastructure.</p></div><span class="coming">PLANNED</span></div></div><p class="eng-note">Design decision: each area gets its own curriculum, questions, exams, and saved progress. The Quant and Math paths remain independent.</p></div>`;}
function notFound(){return `<div class="content-width locked-page">${headerTag('PAGE NOT FOUND')}<h1>This path does not <em>exist yet.</em></h1><a href="#/" class="btn btn-dark">Return home ↗</a></div>`;}
const recentQuestions=new Map();
function nextQuestion(topic,avoidTemplate=-1){const factories=BANK[topic];if(!factories?.length)throw Error('Missing bank: '+topic);let arr=Array.from({length:factories.length},(_,i)=>i).filter(i=>i!==avoidTemplate);if(!arr.length)arr=[0];let pool=arr.filter(i=>i!==recentQuestions.get(topic));if(!pool.length)pool=arr;let idx=pick(pool),q=factories[idx]();recentQuestions.set(topic,idx);return {...q,topic,template:idx};}
function pickAssessment(topic,step,mode){if(PEDAGOGY.available(topic)&&(step===1||step===3||mode==='exam'&&step%3===1))return {...PEDAGOGY.next(topic),topic,template:'multi'};return nextQuestion(topic);}
function startCheck(topic,mode='gate'){session.mode=mode;session.topic=topic;session.step=0;session.total=mode==='warmup'?3:5;session.question=pickAssessment(topic,0,mode);session.feedback=null;session.repairOf=null;session.needsRetake=false;paintExercise();}
function startExam(course,id){const m=MODULES[course]?.find(m=>m.id===id);if(!m||!examUnlocked(course,id)){toast('Finish the lessons in this module first.');go('#/'+(course||'quant'));return;}
 session.course=course;session.module=m;session.mode='exam';session.total=10;session.step=0;session.question=null;session.feedback=null;session.failCount=0;session.examTopics=Array.from({length:10},(_,i)=>m.ids[i%m.ids.length]);for(let i=9;i>0;i--){let j=rand(0,i);[session.examTopics[i],session.examTopics[j]]=[session.examTopics[j],session.examTopics[i]];}session.question=pickAssessment(session.examTopics[0],0,'exam');renderExam();}
function questionHTML(){const q=session.question;if(!q)return '';const result=session.feedback,mode=session.mode;const title=mode==='repair'?'TARGETED REPAIR':mode==='exam'?'MODULE EXAM':mode==='warmup'?'PRACTICE':'MASTERY CHECK';let answer='';
 if(!result){if(q.type==='multipart'){answer=`<form id="answerForm" class="multi-form"><div class="question-steps">${q.parts.map((part,i)=>`<label class="step-field"><span><b>${i+1}</b> ${e(part.label)}</span><input class="multi-input" type="text" required autocomplete="off" inputmode="decimal" placeholder="Enter numeric result" aria-label="${e(part.label)}"></label>`).join('')}</div><label class="reasoning-label">Explain your method (for reflection; not automatically graded)<textarea id="reasoningAnswer" rows="4" placeholder="State assumptions, derive equations, then sanity-check your result..."></textarea></label><button class="btn btn-dark" type="submit">Check all steps ↗</button></form>`;}else if(q.type==='choice')answer=`<div class="choices">${q.options.map((o,i)=>`<button type="button" data-choice="${e(o)}"><span>${'ABCD'[i]}</span>${e(o)}</button>`).join('')}</div>`;else answer=`<form id="answerForm" class="answer-form"><label class="sr-only" for="answerInput">Your answer</label><input type="text" id="answerInput" placeholder="Type an answer (decimal or fraction)" autocomplete="off" inputmode="decimal" required /><button class="btn btn-dark" type="submit">Check answer ↗</button></form>`;}
 const retry=result?`<div class="feedback ${result.ok?'correct':'incorrect'}"><div class="feedback-label">${result.ok?'✓ CORRECT':'✗ NOT QUITE'}</div><strong>${result.ok?'The reasoning checks out.':'Find the principle, then solve a different version.'}</strong><p>${e(q.why)}</p>${q.type==='multipart'?`<div class="solution-grid">${q.parts.map((part,i)=>`<div><span>${e(part.label)}</span><strong>${e(showNum(part.answer))}</strong>${result.parts&&!result.parts[i]?'<small>Review this step</small>':''}</div>`).join('')}</div><p class="reasoning-rubric"><strong>Written reasoning rubric:</strong> Did you state the model assumptions, show the equations, justify each step and check units or limits? Your written explanation is for self-review; this site does not claim to grade prose automatically.</p>`:''}${result.ok?'':`<p class="right-answer">Correct answer: <strong>${e(q.type==='choice'?q.answer:q.type==='multipart'?'See verified steps above':showNum(q.answer))}</strong></p>`}<button class="btn btn-dark" type="button" id="nextQuestion">${result.ok?'Continue →':'Try a different repair problem →'}</button></div>`:'';
 return `<div class="exercise-card"><div class="exercise-top"><span>${title} <span class="exercise-sep">/</span> ${e(LESSON_MAP[q.topic]?.title||q.topic)}</span><span>QUESTION ${Math.min(session.step+1,session.total)} / ${session.total}</span></div><div class="question-progress">${Array.from({length:session.total},(_,i)=>`<i class="${i<session.step?'full':''}"></i>`).join('')}</div><h3>${e(q.question)}</h3><div class="question-caption">${e(q.skill||'Calculation')} · ${q.type==='choice'?'Select one answer':q.type==='multipart'?'Show all calculations; every numeric step is graded':'Numbers, fractions and decimals accepted'}</div>${answer}${retry}</div>`;}
function paintExercise(){let target=$('exerciseArea');if(!target)return;
 if(session.mode==='complete'){const id=session.topic,at=getModuleByLesson(id);target.innerHTML=`<div class="pass-result"><span class="pass-mark">✓</span><span>100% VERIFIED IN THIS CHECK</span><h3>Lesson mastered.</h3><p>You solved five fresh questions consecutively. Keep reviewing later to confirm long-term retention.</p>${buttonToNext(at.course)}<button class="btn btn-line" id="tryAgain">Try another set</button></div>`;return;}
 if(session.mode==='needs-restart'){target.innerHTML=`<div class="retake-prompt"><div class="feedback-label">CORRECTION COMPLETE</div><h3>Try a new ${session.returnTo==='warmup'?'practice':'mastery'} set.</h3><p>The question you missed was replaced with a different problem. You can now restart with newly generated parameters and a clean score.</p><button id="restartSet" class="btn btn-dark">New set ↗</button></div>`;return;}
 if(session.mode==='idle'||!session.question){let id=decodeURI(location.hash.split('/')[2]||''),isDone=mastered(id);target.innerHTML=`<div class="start-mastery"><div><strong>${isDone?'Lesson mastered':'Ready to test understanding?'}</strong><p>Warm-ups are unrestricted. The mastery gate requires five newly generated correct first attempts.</p></div><div class="exercise-start-actions"><button class="btn btn-line" id="startWarmup">Warm up</button><button class="btn btn-dark" id="startMastery">${isDone?'Retake mastery':'Begin mastery check'} ↗</button></div></div>`;return;}
 target.innerHTML=questionHTML();$('answerInput')?.focus({preventScroll:true});}

function numericValue(text){let s=String(text).trim().replace(/,/g,'').replace(/^\$/,'').replace(/%$/,'');if(/^[-+]?\d+(?:\.\d+)?\s*\/\s*[-+]?\d+(?:\.\d+)?$/.test(s)){let [a,b]=s.split('/').map(Number);return b!==0?a/b:NaN;}return s?Number(s):NaN;}
function answer(value){if(!session.question||session.feedback)return;let q=session.question;let match=(a,b)=>Number.isFinite(numericValue(a))&&Math.abs(numericValue(a)-b)<=Math.max(.012,Math.abs(b)*.00045);let parts=q.type==='multipart'?q.parts.map((p,i)=>match(value[i],p.answer)):null;let ok=q.type==='choice'?value===q.answer:q.type==='multipart'?parts.every(Boolean):match(value,q.answer);
 if(q.type==='number'&&!Number.isFinite(numericValue(value))){toast('Enter a valid numeric answer, decimal, or fraction.');return;}if(q.type==='multipart'&&value.some(v=>!Number.isFinite(numericValue(v)))){toast('Enter a number or fraction in every step.');return;}
 progress.attempts++;if(ok)progress.correct++;else{progress.misses[q.topic]=(progress.misses[q.topic]||0)+1;session.repairOf=q;session.returnTo=session.mode;session.failCount++;}save();session.feedback={ok,parts};if(location.hash.startsWith('#/exam'))renderExam();else paintExercise();}
function advance(){let was=session.mode,ok=session.feedback?.ok;if(ok===undefined)return;let id=session.question.topic;
 if(!ok){const missed=session.repairOf;session.mode='repair';session.step=0;session.total=1;session.question=missed.type==='multipart'?nextQuestion(missed.topic):nextQuestion(missed.topic,missed.template);session.feedback=null;if(location.hash.startsWith('#/exam'))renderExam();else paintExercise();return;}
 if(was==='repair'){session.mode='needs-restart';session.feedback=null;session.question=null;if(location.hash.startsWith('#/exam'))renderExam();else paintExercise();return;}
 session.step++;session.feedback=null;
 if(session.step>=session.total){if(was==='gate'){progress.mastered[id]=Date.now();progress.last=id;save();session.mode='complete';session.question=null;paintExercise();}else if(was==='warmup'){session.mode='idle';session.question=null;paintExercise();toast('Warm-up complete. Try the mastery check next.');}else if(was==='exam'){progress.exams[session.course+':'+session.module.id]=Date.now();save();session.mode='exam-complete';session.question=null;renderExam();}return;}
 session.question=pickAssessment(was==='exam'?session.examTopics[session.step]:id,session.step,was);if(was==='exam')renderExam();else paintExercise();}
function renderExam(){if(!location.hash.startsWith('#/exam/'))return;const {course,module:m}=session;let el=$('examBody');if(!el)return;
 if(session.mode==='exam-complete'){el.innerHTML=`<div class="pass-result"><span class="pass-mark">✓</span><span>10 / 10 · 100% PASS</span><h2>Module passed.</h2><p>Every answer was correct. The following module is now available.</p>${buttonToNext(course)}<a class="btn btn-line" href="#/${course}">Course map ↗</a></div>`;return;}
 if(session.mode==='needs-restart'){el.innerHTML=`<div class="retake-prompt"><div class="feedback-label">REPAIR COMPLETE</div><h2>One mistake. A new examination.</h2><p>You've repaired the missed skill. A different 10-question examination is required for a perfect pass.</p><button class="btn btn-dark" id="restartExam">Start fresh examination ↗</button></div>`;return;}
 el.innerHTML=questionHTML();$('answerInput')?.focus({preventScroll:true});}
function examPage(course,id){let m=MODULES[course]?.find(m=>m.id===id);if(!m)return notFound();if(!examUnlocked(course,id))return `<div class="content-width locked-page">${headerTag('FINAL EXAM LOCKED')}<h1>Master each <em>lesson first.</em></h1><button class="btn btn-line" id="enableManual">Open for independent study</button><a class="btn btn-dark" href="#/${course}">Back to curriculum ↗</a></div>`;
 return `<div class="content-width exam-page"><div class="subnav"><a href="#/${course}">← ${course==='math'?'Mathematics':'Quant academy'}</a><span>EXAMINATION / 100% REQUIRED</span></div>${headerTag('MODULE EXAMINATION')}<h1>${e(m.title)}<span class="title-period">.</span></h1><p class="page-lead">Ten randomized problems spanning this module, including multi-part calculations and written reasoning reflections. Every answer must be correct on the first try to pass. A mistake opens a different repair question, then a fresh exam.</p><div id="examBody"></div></div>`;}
function go(to){if(location.hash===to){render();return;}location.hash=to;}
function mountVisuals(){const canvas=document.querySelector('.model-canvas');if(!canvas)return;const wrap=canvas.closest('.model-wrap'),kind=canvas.dataset.kind,conf=AXIOM_VIS.spec(kind),initial=Object.fromEntries(conf.controls.map(c=>[c[0],c[4]]));AXIOM_VIS.mount(canvas,kind,initial,wrap.classList.contains('hero-model-wrap'));if(!wrap.classList.contains('hero-model-wrap')){
  const redraw=()=>{const v={};wrap.querySelectorAll('[data-control]').forEach(r=>{v[r.dataset.control]=Number(r.value);let o=wrap.querySelector('#out-'+r.dataset.control);if(o)o.textContent=showNum(Number(r.value))+(conf.controls.find(c=>c[0]===r.dataset.control)?.[5]||'');});AXIOM_VIS.update(canvas,v);let m=$('liveMetrics');if(m)m.innerHTML=AXIOM_VIS.describe(kind,v).map(([label,val])=>`<div><span>${e(label)}</span><strong>${e(val)}</strong></div>`).join('');};wrap.querySelectorAll('[data-control]').forEach(r=>r.addEventListener('input',redraw));redraw();}
}
function render(){let raw=(location.hash||'#/').replace(/^#\/?/,'').split('/').filter(Boolean),route=raw[0]||'home';let markup='';session.mode=route==='lesson'&&session.topic===raw[1]?session.mode:'idle';
 if(route==='home')markup=home();else if(route==='math'||route==='quant')markup=coursePage(route);else if(route==='practice')markup=examsPage();else if(route==='engineering')markup=engineeringPage();else if(route==='lesson')markup=lessonPage(raw[1]);else if(route==='exam')markup=examPage(raw[1],raw[2]);else markup=notFound();
 $('page').innerHTML=markup;document.querySelectorAll('.top-links a').forEach(a=>a.classList.toggle('nav-active',a.dataset.section===route||(route==='lesson'&&getModuleByLesson(raw[1])?.course===a.dataset.section)));
 if(route==='lesson'){session.topic=raw[1];paintExercise();}else if(route==='exam'&&examUnlocked(raw[1],raw[2])){startExam(raw[1],raw[2]);}
 mountVisuals();updateHeader();window.scrollTo({top:0,behavior:'instant'});
}
window.addEventListener('hashchange',render);
document.addEventListener('click',ev=>{
 const b=ev.target.closest('button');if(b){if(b.id==='toggleManual'||b.id==='enableManual'){const next=b.id==='enableManual'?true:!progress.manual?.all;if(next&&!confirm('Unlock all lessons for exploration? This does not count as passing them.'))return;progress.manual={all:next};save();render();toast(next?'Manual access on; earned mastery is unchanged.':'Strict locks restored.');return;}if(b.id==='startMastery'){startCheck(session.topic,'gate');return;}if(b.id==='startWarmup'){startCheck(session.topic,'warmup');return;}if(b.id==='nextQuestion'){advance();return;}if(b.id==='restartSet'){startCheck(session.topic,session.returnTo==='warmup'?'warmup':'gate');return;}if(b.id==='tryAgain'){startCheck(session.topic,'gate');return;}if(b.id==='restartExam'){startExam(session.course,session.module.id);return;}if(b.dataset.choice!==undefined){answer(b.dataset.choice);return;}if(b.id==='exportProgress'){const blob=new Blob([JSON.stringify({format:'axiom-studio-progress',exportedAt:new Date().toISOString(),progress},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='axiom-studio-v3-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);toast('Progress exported.');return;}
 if(b.classList.contains('menu-toggle')){const nav=document.querySelector('.top-links');nav.classList.toggle('mobile-open');b.setAttribute('aria-expanded',String(nav.classList.contains('mobile-open')));return;}}
 const link=ev.target.closest('a[href^="#"]');if(link){document.querySelector('.top-links').classList.remove('mobile-open');}
 const anchor=ev.target.closest('.reading-side a[href^="#"]');if(anchor){const target=document.querySelector(anchor.getAttribute('href'));if(target){ev.preventDefault();target.scrollIntoView({behavior:'smooth'});}}
});
document.addEventListener('submit',ev=>{if(ev.target.id!=='answerForm')return;ev.preventDefault();answer(session.question?.type==='multipart'?[...ev.target.querySelectorAll('.multi-input')].map(x=>x.value):$('answerInput')?.value??'');});
document.addEventListener('change',ev=>{if(ev.target.id!=='importProgress')return;let f=ev.target.files?.[0];if(!f)return;f.text().then(t=>{try{const p=JSON.parse(t);let data=p.format==='axiom-studio-progress'?p.progress:p;if(![2,3].includes(data?.version)||!data.mastered||!data.exams||typeof data.mastered!=='object'||typeof data.exams!=='object')throw Error('Invalid version or format');if(!confirm('Replace current progress with this imported backup? Your present progress will be overwritten.'))return;const validLessons=Object.fromEntries(Object.entries(data.mastered).filter(([k])=>allIds.has(k)));const validExams=Object.fromEntries(Object.entries(data.exams).filter(([k])=>Object.entries(MODULES).some(([c,ms])=>ms.some(m=>k===c+':'+m.id))));const misses=Object.fromEntries(Object.entries(data.misses||{}).filter(([k,v])=>allIds.has(k)&&Number.isFinite(v)));progress={...fresh(),...data,version:3,mastered:validLessons,exams:validExams,misses,manual:{all:!!data.manual?.all}};save();render();toast('Progress restored.');}catch{toast('This file is not a valid AXIOM progress backup.');}});});
if(!location.hash)history.replaceState(null,'','#/');render();
</script>
