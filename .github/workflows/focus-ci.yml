name: Mastery Focus UX — pre-audit checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'focus*'
      - 'tests/focus-*'
      - 'index.html'
      - 'app.js'
      - 'PHASE11_UX_RELEASE.md'
      - '.github/workflows/focus-ci.yml'
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check focus-core.js
          node --check focus.js
          node tests/focus-reference.test.cjs
  real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/mastery-focus-http.log 2>&1 &
          node tests/focus-browser.test.cjs
