name: Mastery Phase XIV — Visual learning fidelity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'visual-*'
      - 'foundation.html'
      - 'foundation.js'
      - 'VISUAL_LEARNING_PHASE14.md'
      - 'tests/visual-*'
      - '.github/workflows/visual-ci.yml'
permissions:
  contents: read
jobs:
  pure-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify diagram states and algorithm invariants
        run: |
          node --check visual-scenes.js
          node --check visual-engine.js
          node --check foundation.js
          node tests/visual-reference.test.cjs
          node tests/foundation-reference.test.cjs
  actual-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install pinned Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Verify all 15 live SVG scenes and responsive learner interactions
        run: |
          python3 -m http.server 8901 --bind 127.0.0.1 >/tmp/mastery-visual-http.log 2>&1 &
          node tests/visual-browser.test.cjs
