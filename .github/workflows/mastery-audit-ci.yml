name: Mastery product audit — design, navigation and code evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '*.css'
      - 'app.js'
      - 'theme.js'
      - 'focus.js'
      - 'readiness.js'
      - 'tests/mastery-audit-*'
      - '.github/workflows/mastery-audit-ci.yml'
permissions:
  contents: read
jobs:
  source-and-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify 13 HTML entrypoints, source links and audit invariants
        run: |
          node --check app.js
          node --check focus.js
          node --check readiness.js
          node tests/mastery-audit-reference.test.cjs
  real-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install pinned Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Audit across academies and verify code-pass invalidation
        run: |
          python3 -m http.server 8895 --bind 127.0.0.1 >/tmp/mastery-audit-http.log 2>&1 &
          node tests/mastery-audit-browser.test.cjs
          node tests/mastery-audit-code-integrity.test.cjs
