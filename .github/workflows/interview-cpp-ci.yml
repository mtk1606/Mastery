name: Mastery Phase IX C++ Interview Defense QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'interview-cpp.html'
      - 'interview-cpp.css'
      - 'interview-cpp-data.js'
      - 'interview-cpp.js'
      - 'tests/interview-cpp-*'
      - 'tests/native-reference.cjs'
      - '.github/workflows/interview-cpp-ci.yml'
permissions:
  contents: read
jobs:
  native-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile 522 native C++20 reference assertions across three batches
        run: |
          node --check interview-cpp-data.js
          node --check interview-cpp.js
          node tests/native-reference.cjs
  chromium-clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install fixed Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Run six actual browser C++ compilations with Clang 22 WASI
        run: |
          python3 -m http.server 8793 --bind 127.0.0.1 >/tmp/mastery-ix-http.log 2>&1 &
          node tests/interview-cpp-browser.test.cjs